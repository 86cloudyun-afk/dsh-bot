name: Upload frozen private v1 assets
run-name: 上传私有第一版冻结交付文件

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-v1-frozen-assets
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.repository == '86cloudyun-afk/dsh-bot' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/release/v0.1.0-private-v1-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the exact frozen distribution commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdec1bab245a5a41a48029db5be9f0cbdfa7665a
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and upload only the six fixed files to the private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path

          repo = '86cloudyun-afk/dsh-bot'
          tag = 'v0.1.0-private.1'
          source = '1f111d7f3f5c54127a7523571c8ebc1a738575b8'
          asset_commit = 'fdec1bab245a5a41a48029db5be9f0cbdfa7665a'
          release_id = 406470120
          expected = {
              'dsh-bot-v1-private-delivery-20261008-r2.tar.gz': (15558289, '375c4801c92996c6a5d4c6644abaf8d6965c307501f55be13444b8e8a16cf58f'),
              'dsh-bot-v1-private-delivery-20261008-r2.tar.gz.sha256': (113, '1d5709dcd90b82c4800db5bcca98926152c116dd54385ed36cde980dcca8ebbc'),
              'CURRENT_INSTALLATION_GUIDE.zh-CN.md': (13232, '13e76b4be8cc213da22d5a66ed87ac5883ad540ed7ae937b242ab8472f0a3e30'),
              'QUALIFICATION.json': (12054, 'c898da8b5f45177b6ed5c84c9d0a8de875292a1b17dc03920664ab31ef8d4ac6'),
              'dsh-bot-v1-private-delivery-20261008-r2.final-audit.json': (12875, 'b89b0f60da88c1228670ce46b749116733b624c68ad9debd48c81c2557dc0324'),
              'GITHUB-ASSETS.sha256': (543, '418e03a85e9451de76c8bb92124e0f3b0a8ea61416b917a462b94f570df9bf76'),
          }

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == asset_commit
          directory = Path('release-assets')
          assert not directory.is_symlink()
          assert {p.name for p in directory.iterdir()} == set(expected)
          for name, (size, digest) in expected.items():
              path = directory / name
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1, name
              data = path.read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name

          assert api(f'repos/{repo}')['private'] is True
          release = api(f'repos/{repo}/releases/{release_id}')
          assert release['tag_name'] == tag
          assert release['target_commitish'] == source
          assert release['draft'] is True and release['prerelease'] is True
          existing = {row['name']: row for row in release['assets']}
          assert len(existing) == len(release['assets'])
          assert not set(existing) - set(expected)
          for name, row in existing.items():
              size, digest = expected[name]
              assert row['state'] == 'uploaded' and row['size'] == size, name
              assert row.get('digest') == 'sha256:' + digest, name

          for name in expected:
              if name not in existing:
                  subprocess.run(['gh', 'release', 'upload', tag, str(directory / name), '--repo', repo], check=True, timeout=120)

          release = api(f'repos/{repo}/releases/{release_id}')
          assert api(f'repos/{repo}')['private'] is True
          assert release['draft'] is True and release['prerelease'] is True
          assert release['tag_name'] == tag and release['target_commitish'] == source
          uploaded = {row['name']: row for row in release['assets']}
          assert len(uploaded) == len(release['assets']) == len(expected)
          assert set(uploaded) == set(expected)
          rows = []
          for name, (size, digest) in expected.items():
              row = uploaded[name]
              assert row['state'] == 'uploaded' and row['size'] == size, name
              assert row.get('digest') == 'sha256:' + digest, name
              rows.append({'name': name, 'bytes': size, 'sha256': digest, 'assetId': row['id']})

          receipt = {
              'status': 'PASS_FROZEN_PRIVATE_DRAFT_ASSETS',
              'repositoryPrivate': True,
              'releaseId': release_id,
              'tag': tag,
              'productSource': source,
              'assetCommit': asset_commit,
              'workflowCommit': os.environ['GITHUB_SHA'],
              'files': rows,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'private-v1-upload-receipt.json'
          path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Retain the typed upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-v1-upload-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/private-v1-upload-receipt.json
          if-no-files-found: error
          retention-days: 7
