name: Isolated control tests
on:
  push:
    branches: [main, feat/control-plane-alpha, release/v0.1.0-rc.1-source-closure-20261006]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified public tag
        with:
          persist-credentials: false
      - name: Bind validation to the triggering commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified public tag
        with:
          node-version: 22.23.2
      - name: Install locked public SDK without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fresh current-source package snapshots and guarded offline tests
        run: npm test
      - name: Guarded pure native admission policies and exact original test partition
        run: |
          node scripts/test.mjs scripts/native-cold/policy.test.mjs
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_contract.py
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_run.py
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_budget.py
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_binding.py
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_installed_identity.py
          env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/contract.py
      - name: Static module and spec inventory checks
        if: always()
        run: npm run check
  native-cold:
    # Only the approved private candidate push may admit these two native cases.
    # The five existing .native.mjs entries remain outside this grant and CI inventory.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/v0.1.0-rc.1-source-closure-20261006' &&
      github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install locked public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: One builtin denial proof then two real cold cases with pinned native identities
        run: |
          node scripts/native-cold/prepare-current.mjs "$RUNNER_TEMP/native-cold-current" "${{ github.sha }}"
          python3 -B scripts/native-cold/run.py \
            --expected-sha "${{ github.sha }}" \
            --node "$(command -v node)" \
            --temp-dir "$RUNNER_TEMP" \
            --current-dir "$RUNNER_TEMP/native-cold-current" \
            --evidence-dir "$RUNNER_TEMP/native-cold-evidence"
      - name: Retain typed receipts and cleanup outcomes only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified public tag
        with:
          name: native-cold-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-cold-evidence/*.json
          if-no-files-found: error
          retention-days: 7
  runtime-export:
    # Independent necessary job: cold native-resume failures never skip this suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bind validation to the triggering commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install locked public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact runtime-export module suite with offline guard
        # Includes controlled CLI child processes; guard counters are not a zero-child claim.
        run: node --import ./tools/runtime-export/offline-guard.mjs --test tools/runtime-export/export.test.mjs
      - name: Bounded synthetic CLI discovery without SDK or addons
        if: always()
        run: env -i PATH="$PATH" LANG=C python3 -B scripts/native-cold/test_discovery.py
