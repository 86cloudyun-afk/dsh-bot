name: Native plugin checks
permissions:
  contents: read
  checks: write
on:
  push:
  pull_request:
jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-distribution.mjs
      - name: Stage the current frozen package
        run: node -e 'const fs=require("fs");const p=require("./package.json");fs.mkdirSync("qualification/package",{recursive:true});for(const f of [`${p.name}-${p.version}.tgz`,"SHA256SUMS"])fs.copyFileSync(`dist/${f}`,`qualification/package/${f}`)'
      - uses: actions/upload-artifact@v4
        with:
          name: native-plugin-package
          path: qualification/package
  stock-gui:
    needs: artifact
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: native-plugin-package
          path: qualification/package
      - name: Fresh official profile and installed native GUI
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/gui
        run: |
          mkdir -p qualification/gui
          export DSH_BOT_GUI_SHA256="$(cut -d ' ' -f1 qualification/package/SHA256SUMS)"
          node test/native-plugin/stock-gui-run.mjs qualification/package/*.tgz > qualification/stock-boot-private.log 2>&1
      - name: Upgrade an existing v1.0.0 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade
        run: |
          mkdir -p qualification/upgrade
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-private.log 2>&1
      - name: Upgrade an existing v1.0.1 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v101
          DSH_BOT_UPGRADE_FROM: '1.0.1'
        run: |
          mkdir -p qualification/upgrade-v101
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v101-private.log 2>&1
      - name: Upgrade an existing v1.0.2 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v102
          DSH_BOT_UPGRADE_FROM: '1.0.2'
        run: |
          mkdir -p qualification/upgrade-v102
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v102-private.log 2>&1
      - name: Upgrade an existing v1.1.0 schema-two stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v110
          DSH_BOT_UPGRADE_FROM: '1.1.0'
        run: |
          mkdir -p qualification/upgrade-v110
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v110-private.log 2>&1
      - name: Require all five stock qualification reports
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync,existsSync} from 'node:fs';
          const sources=['gui','upgrade','upgrade-v101','upgrade-v102','upgrade-v110'];
          const rows=sources.map(source=>{
            const path=`qualification/${source}/stock-gui-report.json`;
            const report=existsSync(path)?JSON.parse(readFileSync(path,'utf8')):{};
            const checks=Object.entries(report.checks??{});
            return {source,passed:report.passed===true&&report.teardownComplete===true&&checks.length>0&&checks.every(([,value])=>value===true),checks:checks.length};
          });
          const summary=['## Official stock qualification', '', '| Profile | Result | Checks |', '| --- | --- | --- |', ...rows.map(row=>`| ${row.source} | ${row.passed?'Passed':'Failed or missing'} | ${row.checks} |`), ''].join('\n');
          console.log(summary);appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          assert.ok(rows.every(row=>row.passed),'Every GUI and immutable upgrade source must pass with completed teardown');
          JS
      - name: Sanitized GUI qualification report
        if: always()
        run: node -e 'const fs=require("fs");for(const p of ["qualification/gui/stock-gui-report.json","qualification/upgrade/stock-gui-report.json","qualification/upgrade-v101/stock-gui-report.json","qualification/upgrade-v102/stock-gui-report.json","qualification/upgrade-v110/stock-gui-report.json"])if(fs.existsSync(p))console.log(fs.readFileSync(p,"utf8"));'
      - name: Publish readable qualification check
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          GUI_PLATFORM: ${{ matrix.os }}
        with:
          script: |
            const fs = require('fs');
            const path = 'qualification/gui/stock-gui-report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : {passed:false,stage:'runner-initialization',error:'No qualification report was produced'};
            const upgradePath = 'qualification/upgrade/stock-gui-report.json';
            const upgrade = fs.existsSync(upgradePath) ? JSON.parse(fs.readFileSync(upgradePath, 'utf8')) : {passed:false,error:'Upgrade qualification did not run'};
            const {requests: upgradeRequests, ...upgradeSummary} = upgrade;
            report.upgrade = {...upgradeSummary, controlledRequests:upgradeRequests?.length??0};
            const v101Path = 'qualification/upgrade-v101/stock-gui-report.json';
            const v101 = fs.existsSync(v101Path) ? JSON.parse(fs.readFileSync(v101Path, 'utf8')) : {passed:false,error:'v1.0.1 upgrade qualification did not run'};
            const {requests: v101Requests, ...v101Summary} = v101;
            report.upgradeV101 = {...v101Summary, controlledRequests:v101Requests?.length??0};
            const v102Path = 'qualification/upgrade-v102/stock-gui-report.json';
            const v102 = fs.existsSync(v102Path) ? JSON.parse(fs.readFileSync(v102Path, 'utf8')) : {passed:false,error:'v1.0.2 upgrade qualification did not run'};
            const {requests: v102Requests, ...v102Summary} = v102;
            report.upgradeV102 = {...v102Summary, controlledRequests:v102Requests?.length??0};
            const v110Path = 'qualification/upgrade-v110/stock-gui-report.json';
            const v110 = fs.existsSync(v110Path) ? JSON.parse(fs.readFileSync(v110Path, 'utf8')) : {passed:false,error:'v1.1.0 schema-two upgrade qualification did not run'};
            const {requests: v110Requests, ...v110Summary} = v110;
            report.upgradeV110 = {...v110Summary, controlledRequests:v110Requests?.length??0};
            report.passed = !!report.passed && !!upgrade.passed && !!v101.passed && !!v102.passed && !!v110.passed;
            const {requests, ...summary} = report;
            summary.controlledRequests = requests?.length ?? 0;
            const text = '```json\n' + JSON.stringify(summary, null, 2) + '\n```';
            await core.summary.addHeading('官方原版 DSH 插件验收').addRaw(text).write();
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: context.sha, name: `原生 GUI (${process.env.GUI_PLATFORM})`,
              status: 'completed', conclusion: report.passed ? 'success' : 'failure',
              output: { title: report.passed ? '官方原版 GUI 检查通过' : '官方原版 GUI 检查失败', summary: text },
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-gui-${{ matrix.os }}
          path: |
            qualification/gui/stock-gui-report.json
            qualification/gui/*.png
            qualification/upgrade/stock-gui-report.json
            qualification/upgrade-v101/stock-gui-report.json
            qualification/upgrade-v102/stock-gui-report.json
            qualification/upgrade-v110/stock-gui-report.json
