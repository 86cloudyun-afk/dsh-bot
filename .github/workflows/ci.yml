name: Native plugin checks
permissions:
  contents: read
  checks: write
on:
  push:
  pull_request:
jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-distribution.mjs
      - name: Stage the current frozen package
        run: node -e 'const fs=require("fs");const p=require("./package.json");fs.mkdirSync("qualification/package",{recursive:true});for(const f of [`${p.name}-${p.version}.tgz`,"SHA256SUMS"])fs.copyFileSync(`dist/${f}`,`qualification/package/${f}`)'
      - uses: actions/upload-artifact@v4
        with:
          name: native-plugin-package
          path: qualification/package
  stock-gui:
    needs: artifact
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: npm ci --ignore-scripts
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: native-plugin-package
          path: qualification/package
      - name: Fresh official profile and installed native GUI
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/gui
        run: |
          mkdir -p qualification/gui
          export DSH_BOT_GUI_SHA256="$(cut -d ' ' -f1 qualification/package/SHA256SUMS)"
          node test/native-plugin/stock-gui-run.mjs qualification/package/*.tgz > qualification/stock-boot-private.log 2>&1
      - name: Upgrade an existing v1.0.0 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade
        run: |
          mkdir -p qualification/upgrade
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-private.log 2>&1
      - name: Upgrade an existing v1.0.1 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v101
          DSH_BOT_UPGRADE_FROM: '1.0.1'
        run: |
          mkdir -p qualification/upgrade-v101
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v101-private.log 2>&1
      - name: Upgrade an existing v1.0.2 stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v102
          DSH_BOT_UPGRADE_FROM: '1.0.2'
        run: |
          mkdir -p qualification/upgrade-v102
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v102-private.log 2>&1
      - name: Upgrade an existing v1.1.0 schema-two stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v110
          DSH_BOT_UPGRADE_FROM: '1.1.0'
        run: |
          mkdir -p qualification/upgrade-v110
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v110-private.log 2>&1
      - name: Upgrade an existing v1.1.1 schema-two stock profile
        shell: bash
        env:
          DSH_BOT_GUI_OUTPUT: qualification/upgrade-v111
          DSH_BOT_UPGRADE_FROM: '1.1.1'
        run: |
          mkdir -p qualification/upgrade-v111
          node test/native-plugin/stock-upgrade-run.mjs qualification/package/*.tgz > qualification/stock-upgrade-v111-private.log 2>&1
      - name: Require all six complete stock qualification reports
        if: always()
        shell: bash
        run: node test/native-plugin/stock-qualification.mjs qualification
      - name: Sanitized GUI qualification report
        if: always()
        run: node -e 'const fs=require("fs");for(const p of ["qualification/gui/stock-gui-report.json","qualification/upgrade/stock-gui-report.json","qualification/upgrade-v101/stock-gui-report.json","qualification/upgrade-v102/stock-gui-report.json","qualification/upgrade-v110/stock-gui-report.json","qualification/upgrade-v111/stock-gui-report.json"])if(fs.existsSync(p))console.log(fs.readFileSync(p,"utf8"));'
      - name: Publish readable qualification check
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          GUI_PLATFORM: ${{ matrix.os }}
        with:
          script: |
            const {resolve} = require('path');
            const {pathToFileURL} = require('url');
            const {qualifyStockReports,readStockTarget} = await import(pathToFileURL(resolve('test/native-plugin/stock-qualification.mjs')).href);
            const {publicStockError} = await import(pathToFileURL(resolve('test/native-plugin/stock-report.mjs')).href);
            let result;
            try {
              const target = await readStockTarget({sourceCommit:context.sha});
              result = await qualifyStockReports('qualification',{target});
            } catch(error) {
              result = {passed:false,reports:{gui:{passed:false,error:publicStockError(error)}}};
            }
            const summarize = report => {
              const {requests,...summary} = report ?? {passed:false};
              summary.controlledRequests = requests?.length ?? summary.controlledRequests ?? 0;
              return summary;
            };
            const summary = summarize(result.reports.gui);
            for(const [source,key] of [['upgrade','upgrade'],['upgrade-v101','upgradeV101'],['upgrade-v102','upgradeV102'],['upgrade-v110','upgradeV110'],['upgrade-v111','upgradeV111']])summary[key] = summarize(result.reports[source]);
            summary.passed = result.passed;
            const text = '```json\n' + JSON.stringify(summary, null, 2) + '\n```';
            await core.summary.addHeading('官方原版 DSH 插件验收').addRaw(text).write();
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: context.sha, name: `原生 GUI (${process.env.GUI_PLATFORM})`,
              status: 'completed', conclusion: result.passed ? 'success' : 'failure',
              output: { title: result.passed ? '官方原版 GUI 检查通过' : '官方原版 GUI 检查失败', summary: text },
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-gui-${{ matrix.os }}
          path: |
            qualification/gui/stock-gui-report.json
            qualification/gui/*.png
            qualification/upgrade/stock-gui-report.json
            qualification/upgrade-v101/stock-gui-report.json
            qualification/upgrade-v102/stock-gui-report.json
            qualification/upgrade-v110/stock-gui-report.json
            qualification/upgrade-v111/stock-gui-report.json
